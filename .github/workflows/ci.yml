name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build-and-test:
    name: Build and test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc python3

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Verify basic output
        run: |
          ./build/moofetch --version
          ./build/moofetch --list-animations
          ./build/moofetch --logo-type animation --logo arch --pipe | head -5

      - name: PTY smoke tests
        run: python3 tests/pty_smoke.py build/moofetch

      - name: Build upstream fastfetch baseline
        run: |
          git clone --depth 1 --branch 2.68.1 https://github.com/fastfetch-cli/fastfetch /tmp/fastfetch-2.68.1
          cmake -B /tmp/fastfetch-2.68.1/build -S /tmp/fastfetch-2.68.1 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/fastfetch-2.68.1/build -j"$(nproc)"

      - name: Compatibility tests against upstream
        run: tests/config_compat.sh build/moofetch /tmp/fastfetch-2.68.1/build/fastfetch
