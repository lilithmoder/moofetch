name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Build release (linux amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc python3

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: python3 tests/pty_smoke.py build/moofetch

      - name: Package
        run: |
          name="moofetch-${{ github.ref_name }}-linux-amd64"
          mkdir -p "dist/$name"
          cp build/moofetch build/mooflash "dist/$name/"
          cp README.md UPSTREAM.md LICENSE "dist/$name/"
          mkdir -p "dist/$name/examples"
          cp examples/*.anim examples/README.md "dist/$name/examples/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moofetch-linux-amd64
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
